<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker></defs><rect width="1600" height="860" fill="#0b1020"/>
<text x="40" y="52" font-size="30" fill="#e2e8f0" font-weight="700" text-anchor="start">Pipeline flow</text>
<text x="40" y="80" font-size="15.5" fill="#94a3b8" font-weight="400" text-anchor="start">From a requirement to a running, tested app</text>
<rect x="700" y="40" width="16" height="16" rx="4" fill="#10b981" stroke="#10b981" stroke-width="1.6"/>
<text x="724" y="53" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">New in this version</text>
<rect x="905" y="40" width="16" height="16" rx="4" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="929" y="53" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">Existing</text>
<rect x="1110" y="40" width="16" height="16" rx="4" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.6"/>
<text x="1134" y="53" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">Data store</text>
<rect x="1315" y="40" width="16" height="16" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.6"/>
<text x="1339" y="53" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">External service</text>
<rect x="40" y="130" width="300" height="90" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="190.0" y="169.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">1  Requirement</text>
<text x="190.0" y="192.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">plain-text description</text>
<rect x="400" y="130" width="330" height="90" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="565.0" y="169.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">2  Planning agent</text>
<text x="565.0" y="192.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">features, tasks, one file each, API contract</text>
<rect x="790" y="130" width="330" height="90" rx="12" fill="#141b34" stroke="#10b981" stroke-width="2.2"/>
<text x="955.0" y="169.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">3  Plan review</text>
<text x="955.0" y="192.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">human edits and approves the plan</text>
<rect x="1076" y="121" width="40" height="18" rx="9" fill="#10b981"/>
<text x="1096" y="134" font-size="10.5" fill="#04261c" font-weight="700" text-anchor="middle">NEW</text>
<rect x="1180" y="130" width="380" height="90" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="1370.0" y="169.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">4  Scheduler</text>
<text x="1370.0" y="192.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">runs tasks in dependency order, in parallel</text>
<line x1="340" y1="175" x2="400" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="730" y1="175" x2="790" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1120" y1="175" x2="1180" y2="175" stroke="#10b981" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="760" y="252" font-size="12.5" fill="#10b981" font-weight="400" text-anchor="middle">edit tasks, dependencies, API shapes (cycles rejected)</text>
<rect x="40" y="270" width="1520" height="300" rx="12" fill="#10172e" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="420" y="298" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Self-correction loop (per task)</text>
<rect x="70" y="340" width="260" height="90" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="200.0" y="379.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">5  Developer</text>
<text x="200.0" y="402.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">writes the planned file</text>
<rect x="400" y="340" width="260" height="90" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="530.0" y="379.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">6  Testing</text>
<text x="530.0" y="402.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">npm install, Jest tests</text>
<rect x="730" y="340" width="260" height="90" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="860.0" y="379.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">7  Evaluator</text>
<text x="860.0" y="402.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">score 0-10 per attempt</text>
<polygon points="1190,325.0 1305.0,385 1190,445.0 1075.0,385" fill="#141b34" stroke="#f59e0b" stroke-width="2"/>
<text x="1190" y="383" font-size="15" fill="#e2e8f0" font-weight="600" text-anchor="middle">score &gt;= 6?</text>
<text x="1190" y="402" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">and tests ok</text>
<line x1="330" y1="385" x2="400" y2="385" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="385" x2="730" y2="385" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="990" y1="385" x2="1075" y2="385" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1350" y="335" width="190" height="100" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="1445.0" y="379.0" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Task DONE</text>
<text x="1445.0" y="402.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">saved to memory</text>
<line x1="1305" y1="385" x2="1350" y2="385" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1327" y="376" font-size="12.5" fill="#10b981" font-weight="700" text-anchor="middle">yes</text>
<rect x="730" y="475" width="260" height="70" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="860.0" y="504.0" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Debugging agent</text>
<text x="860.0" y="527.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">root cause + critique</text>
<path d="M 1190 445 L 1190 510 L 990 510" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1200" y="470" font-size="12.5" fill="#f59e0b" font-weight="700" text-anchor="start">no</text>
<path d="M 730 510 L 200 510 L 200 430" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="500" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">retry with the critique (max 2 attempts)</text>
<rect x="1350" y="475" width="190" height="70" rx="12" fill="#141b34" stroke="#f59e0b" stroke-width="1.6"/>
<text x="1445.0" y="504.0" font-size="15.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">Task FAILED</text>
<text x="1445.0" y="527.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">dependents blocked</text>
<line x1="1190" y1="510" x2="1350" y2="510" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1270" y="502" font-size="12.5" fill="#f59e0b" font-weight="400" text-anchor="middle">attempts used up</text>
<path d="M 1370 220 L 1370 262 L 200 262 L 200 340" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1100" y="255" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">each ready task is dispatched to the loop</text>
<rect x="40" y="640" width="360" height="100" rx="12" fill="#141b34" stroke="#10b981" stroke-width="2.2"/>
<text x="220.0" y="684.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">8  Live preview</text>
<text x="220.0" y="707.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">install + run the app on a free port</text>
<rect x="356" y="631" width="40" height="18" rx="9" fill="#10b981"/>
<text x="376" y="644" font-size="10.5" fill="#04261c" font-weight="700" text-anchor="middle">NEW</text>
<rect x="470" y="640" width="360" height="100" rx="12" fill="#141b34" stroke="#10b981" stroke-width="2.2"/>
<text x="650.0" y="684.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">9  Run report</text>
<text x="650.0" y="707.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">first-pass rate, retries, tokens, errors</text>
<rect x="786" y="631" width="40" height="18" rx="9" fill="#10b981"/>
<text x="806" y="644" font-size="10.5" fill="#04261c" font-weight="700" text-anchor="middle">NEW</text>
<rect x="900" y="640" width="330" height="100" rx="12" fill="#141b34" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="1065.0" y="684.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">10  ZIP export</text>
<text x="1065.0" y="707.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">runnable project + reports</text>
<rect x="1300" y="640" width="260" height="100" rx="12" fill="#141b34" stroke="#10b981" stroke-width="2.2"/>
<text x="1430.0" y="684.0" font-size="17" fill="#e2e8f0" font-weight="600" text-anchor="middle">LangSmith</text>
<text x="1430.0" y="707.0" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">trace of the whole run</text>
<rect x="1516" y="631" width="40" height="18" rx="9" fill="#10b981"/>
<text x="1536" y="644" font-size="10.5" fill="#04261c" font-weight="700" text-anchor="middle">NEW</text>
<path d="M 220 570 L 220 640" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="236" y="612" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">when every task has finished</text>
<line x1="400" y1="690" x2="470" y2="690" stroke="#10b981" stroke-width="2" marker-end="url(#arrowg)"/>
<line x1="830" y1="690" x2="900" y2="690" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="790" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">When every task has finished (done, failed or blocked) the project is marked COMPLETED and can be run, inspected and exported.</text>
</svg>