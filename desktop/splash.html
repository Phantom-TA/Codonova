<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" />
<title>Codonova</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1b1440 0%, #080d1a 60%);
    color: #e2e8f0; padding: 28px 32px; display: flex; flex-direction: column;
    border: 1px solid rgba(139, 92, 246, .25); -webkit-app-region: drag; user-select: none;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .logo { width: 44px; height: 44px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px;
       background: linear-gradient(90deg, #a78bfa, #34d399); -webkit-background-clip: text; color: transparent; }
  .sub { font-size: 11px; color: #64748b; margin-top: 2px; }
  ul { list-style: none; display: grid; gap: 10px; margin-bottom: 18px; }
  li { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #64748b; }
  li .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #334155; flex: none; }
  li.active { color: #e2e8f0; }
  li.active .dot { border-color: #8b5cf6; border-top-color: transparent; animation: spin .9s linear infinite; }
  li.done { color: #a7f3d0; }
  li.done .dot { background: #10b981; border-color: #10b981; position: relative; animation: none; }
  li.done .dot::after { content: '✓'; position: absolute; inset: 0; font-size: 11px; line-height: 14px;
                        text-align: center; color: #052e22; font-weight: 700; }
  li.error { color: #fca5a5; }
  li.error .dot { background: #ef4444; border-color: #ef4444; animation: none; }
  #detail { font-size: 11px; color: #94a3b8; min-height: 32px; line-height: 1.5; word-break: break-word; }
  #detail.error { color: #fca5a5; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
      <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#g)"/>
      <path d="M43 22a16 16 0 1 0 0 20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="butt"/>
    </svg>
    <div><h1>Codonova</h1><div class="sub">Autonomous software development</div></div>
  </div>
  <ul>
    <li id="docker"><span class="dot"></span><span>Checking Docker</span></li>
    <li id="services"><span class="dot"></span><span>Starting services</span></li>
    <li id="backend"><span class="dot"></span><span>Waiting for the backend</span></li>
    <li id="ui"><span class="dot"></span><span>Opening the dashboard</span></li>
  </ul>
  <div id="detail"></div>
<script>
  const order = ['docker', 'services', 'backend', 'ui']
  // state: 'active' | 'done' | 'error'
  function setStep(id, state, detail) {
    const el = document.getElementById(id)
    if (!el) return
    el.className = state
    if (state === 'active') {
      // everything before this step is finished
      order.slice(0, order.indexOf(id)).forEach(s => { document.getElementById(s).className = 'done' })
    }
    if (detail !== undefined) setDetail(detail, state === 'error')
  }
  function setDetail(text, isError) {
    const d = document.getElementById('detail')
    d.textContent = text
    d.className = isError ? 'error' : ''
  }
</script>
</body>
</html>
